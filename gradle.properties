org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Full Legado + DroidFS source integration is memory-heavy during KSP/D8 transforms.
# Limit concurrent Gradle workers so the CI runner does not trade heap stability for parallelism.
org.gradle.workers.max=2
