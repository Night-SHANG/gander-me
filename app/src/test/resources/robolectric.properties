# SDK 36 matches compileSdk, so the tests run against the framework the app is
# built for. Robolectric needs 4.16 or newer for it, and a JDK 21 toolchain,
# which is what CI and ~/.gradle/gradle.properties already select.
sdk=36

# Match the real merged manifest. DroidFS providers expect this Application type,
# while opening an encrypted volume (and therefore native filesystem work) remains lazy.
application=sushi.hardcore.droidfs.VolumeManagerApp
