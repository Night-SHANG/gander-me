name: Build

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch supersedes the first; there is no reason to keep
# building the commit nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The viewer pages are half the hand-written code and none of it is Kotlin,
  # so they are tested in a real browser rather than on a device. Runs beside
  # the Android job, not after it: neither needs the other's output.
  viewer:
    runs-on: ubuntu-latest
    # The image scripts/test-viewer-visual.sh uses, so the reference screenshots
    # are compared under the Chromium and the fonts they were made with rather
    # than whatever the runner image carries this month. The browser is in it.
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: pip install -r tests/viewer/requirements.txt

      # Including the reference screenshots, which only run on Linux: text
      # rasterises differently on macOS, so this is the one place they mean
      # anything. See tests/viewer/goldens/README.md.
      - name: Viewer tests
        run: pytest tests/viewer -q

      # The rendered page beside the golden it failed against, and the
      # difference between them. Nothing to look at unless something broke.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gander-viewer-screenshots
          path: tests/viewer/goldens/*.png
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned upstream sources
        run: |
          git submodule update --init third_party/legado third_party/droidfs
          git -C third_party/droidfs config             submodule.app/libgocryptfs.url https://github.com/hardcore-sushi/libgocryptfs.git
          git -C third_party/droidfs submodule update --init app/libgocryptfs
          git -C third_party/droidfs/app/libgocryptfs submodule update --init openssl

      # The wrapper jar is a binary that runs before any of this repo's own
      # code does, and pull requests arrive from 31 forks. This checks it is
      # one Gradle published rather than one somebody edited.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Same-repository development PRs may refresh Gradle caches. Fork PRs stay
          # read-only so untrusted code cannot populate caches consumed elsewhere.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      # libgocryptfs + OpenSSL are expensive but deterministic for a pinned source
      # commit, NDK and Go version. Save this cache immediately after building it so
      # later test/lint failures do not throw away the native work.
      - name: Restore DroidFS native cache
        id: droidfs_native_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/droidfs/app/libgocryptfs/build
            third_party/droidfs/app/libgocryptfs/lib
            third_party/droidfs/app/libgocryptfs/include
          key: droidfs-native-${{ runner.os }}-ndk28.2.13676358-go1.24-libgocryptfs-4cf68bded7cfd6cce646516e059b10561589ad2d

      - name: Ensure Android NDK
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -d "$NDK_DIR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          else
            echo "Using preinstalled NDK at $NDK_DIR"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        if: steps.droidfs_native_cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.24.x'

      - name: Install DroidFS native build tools
        if: steps.droidfs_native_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential perl nasm

      - name: Build pinned DroidFS native dependencies
        if: steps.droidfs_native_cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          (cd third_party/droidfs/app/libgocryptfs && ./build.sh)

      - name: Save DroidFS native cache
        if: steps.droidfs_native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/droidfs/app/libgocryptfs/build
            third_party/droidfs/app/libgocryptfs/lib
            third_party/droidfs/app/libgocryptfs/include
          key: droidfs-native-${{ runner.os }}-ndk28.2.13676358-go1.24-libgocryptfs-4cf68bded7cfd6cce646516e059b10561589ad2d

      # One Gradle invocation avoids paying configuration/startup cost four times.
      # --continue keeps every independent task running after a failure, so tests,
      # lint, debug and release expose as many problems as possible in one CI run.
      - name: Android validation
        id: android_validation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --continue

      # A debug APK is still useful when tests/lint/release fail independently.
      - name: Checksum the debug APK
        if: always() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        run: shasum -a 256 app/build/outputs/apk/debug/*.apk

      - if: always() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gander-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gander-reports
          path: app/build/reports/
          retention-days: 7

      - name: Summarize validation
        if: always()
        run: |
          echo "Android validation: ${{ steps.android_validation.outcome }}"
          echo "Gradle ran unit tests, lint, debug and release in one task graph with --continue."
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more validation gates failed; see all logs above and uploaded reports."
            exit 1
          fi
