name: Build

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch supersedes the first; there is no reason to keep
# building the commit nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The viewer pages are half the hand-written code and none of it is Kotlin,
  # so they are tested in a real browser rather than on a device. Runs beside
  # the Android job, not after it: neither needs the other's output.
  viewer:
    runs-on: ubuntu-latest
    # The image scripts/test-viewer-visual.sh uses, so the reference screenshots
    # are compared under the Chromium and the fonts they were made with rather
    # than whatever the runner image carries this month. The browser is in it.
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: pip install -r tests/viewer/requirements.txt

      # Including the reference screenshots, which only run on Linux: text
      # rasterises differently on macOS, so this is the one place they mean
      # anything. See tests/viewer/goldens/README.md.
      - name: Viewer tests
        run: pytest tests/viewer -q

      # The rendered page beside the golden it failed against, and the
      # difference between them. Nothing to look at unless something broke.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gander-viewer-screenshots
          path: tests/viewer/goldens/*.png
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned upstream sources
        run: |
          git submodule update --init third_party/legado third_party/droidfs
          git -C third_party/droidfs config             submodule.app/libgocryptfs.url https://github.com/hardcore-sushi/libgocryptfs.git
          git -C third_party/droidfs submodule update --init app/libgocryptfs
          git -C third_party/droidfs/app/libgocryptfs submodule update --init openssl

      # The wrapper jar is a binary that runs before any of this repo's own
      # code does, and pull requests arrive from 31 forks. This checks it is
      # one Gradle published rather than one somebody edited.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install DroidFS native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git gnupg2 wget npm perl nasm
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build pinned DroidFS native dependencies
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          (cd third_party/droidfs/app/libgocryptfs && ./build.sh)

      # Validation is deliberately non-fail-fast. Each independent category gets
      # a chance to run so one CI attempt exposes as many problems as possible.
      # --continue also tells Gradle to keep running tasks that do not depend on
      # a failed task. A final summary step turns the job red if anything failed.
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --continue

      # Against app/lint-baseline.xml, so existing frozen findings remain visible
      # while new findings are reported in the same CI attempt as tests/builds.
      - name: Lint
        id: lint
        continue-on-error: true
        run: ./gradlew lintDebug --continue

      - name: Build debug APK
        id: debug_apk
        continue-on-error: true
        run: ./gradlew assembleDebug --continue

      # Also builds the release merged manifest, which is the one that actually
      # ships, so checkReleasePermissions guards it too. Unsigned without a keystore.
      - name: Build release APK
        id: release_apk
        continue-on-error: true
        run: ./gradlew assembleRelease --continue

      # A debug artifact is still useful when another independent gate failed.
      - name: Checksum the debug APK
        if: always() && steps.debug_apk.outcome == 'success'
        run: shasum -a 256 app/build/outputs/apk/debug/*.apk

      - if: always() && steps.debug_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gander-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Always retain reports if any validation gate failed, even when later gates
      # kept running and produced additional failures.
      - if: >-
          always() &&
          (steps.unit_tests.outcome == 'failure' ||
           steps.lint.outcome == 'failure' ||
           steps.debug_apk.outcome == 'failure' ||
           steps.release_apk.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: gander-reports
          path: app/build/reports/
          retention-days: 7

      - name: Summarize validation
        if: always()
        shell: bash
        run: |
          echo "Unit tests:  ${{ steps.unit_tests.outcome }}"
          echo "Lint:        ${{ steps.lint.outcome }}"
          echo "Debug APK:   ${{ steps.debug_apk.outcome }}"
          echo "Release APK: ${{ steps.release_apk.outcome }}"

          failed=0
          for result in \
            "${{ steps.unit_tests.outcome }}" \
            "${{ steps.lint.outcome }}" \
            "${{ steps.debug_apk.outcome }}" \
            "${{ steps.release_apk.outcome }}"
          do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more validation gates failed; see all logs above and uploaded reports."
            exit 1
          fi
